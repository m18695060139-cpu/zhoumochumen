<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>:root{--paper:#F4EEDF;--paper2:#EFE6D2;--ink:#2B2925;--soft:#6B655A;--green:#2F5D50;--brick:#A4473A;--line:#C9BFA8;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font-family:"Noto Serif CJK SC","Noto Color Emoji",serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sans{font-family:"Noto Sans CJK SC","Noto Color Emoji",sans-serif}
.stamp{position:absolute;border-radius:50%;border:2px solid var(--brick);color:var(--brick);display:flex;align-items:center;justify-content:center;text-align:center;opacity:.78;transform:rotate(-12deg)}
.stamp::before{content:"";position:absolute;inset:3px;border-radius:50%;border:1px solid var(--brick)}

@page{size:1242px 1660px;margin:0} .cv{width:1242px;height:1660px;position:relative;overflow:hidden;background:var(--paper)}
.cv{background:radial-gradient(ellipse at 50% 40%,#F7F2E6,#EAE0CB)}
.card{position:absolute;left:110px;right:110px;top:210px;bottom:250px;background:#FAF5EA;border:2px solid #D8CDB4;box-shadow:0 18px 40px rgba(80,60,30,.12);padding:90px 80px 70px 120px;transform:rotate(-1.2deg)}
.card::before{content:"";position:absolute;left:84px;top:0;bottom:0;border-left:3px solid var(--brick);opacity:.6}
.card .lines{position:absolute;left:0;right:0;bottom:70px;height:440px;background:repeating-linear-gradient(to bottom,transparent 0 86px,#D3C8AE 86px 88px)}
.top{position:absolute;top:96px;left:110px;right:110px;display:flex;justify-content:space-between;font-size:34px;color:var(--green);letter-spacing:6px}
.lab2{font-size:30px;color:var(--green);letter-spacing:6px;border-bottom:3px solid var(--green);padding-bottom:16px;display:flex;justify-content:space-between}
.big{font-size:150px;font-weight:700;color:var(--ink);line-height:1.22;margin-top:60px;letter-spacing:6px}
.big em{font-style:normal;color:var(--brick)}
.sub{font-size:52px;color:var(--green);margin-top:44px;letter-spacing:8px;font-weight:600}
.hand{position:relative;z-index:1;font-size:46px;line-height:88px;margin-top:70px}
.hand div{height:88px;border-bottom:2px solid #D3C8AE}
.hand .k{color:var(--soft);font-size:32px;margin-right:18px}
.bottom{position:absolute;bottom:110px;left:110px;right:110px;display:flex;justify-content:space-between;align-items:center;font-size:34px;color:var(--soft)}
.bottom b{color:var(--ink);font-size:42px;letter-spacing:4px}</style></head><body><div class="cv"><div class="top"><span>周末出门 · 真人图书馆</span><span>No.02</span></div>
<div class="card">
<div class="lab2"><span>借书卡</span><span>LIBRARY CARD</span></div>
<div class="big">周六来<br>借一个人<em>读</em></div><div class="sub">周六 · 宜昌 · 真人图书馆</div>
<div class="hand"><div><span class="k">借阅</span>几位朋友当书</div><div><span class="k">方式</span>围坐着一本一本读</div><div><span class="k">每本</span>约 35 分钟</div><div><span class="k">提问</span>想问的都可以问</div></div></div>
<div class="stamp" style="width:250px;height:250px;right:120px;top:930px;border-width:5px"><div style="line-height:1.3;position:relative"><div style="font-size:26px;letter-spacing:4px">周末出门</div><div style="font-size:54px;font-weight:900">借阅</div><div style="font-size:22px;letter-spacing:2px">宜昌</div></div></div>
<div class="bottom"><span>小红书 @周末出门</span><b>评论区留「想借书」</b></div></div></body></html>
